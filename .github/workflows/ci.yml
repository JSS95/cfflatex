name: CI

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

jobs:
  # Lint stage. The test jobs start only after every lint job passes.

  badness:
    name: Lint LaTeX (badness)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # badness checks the .sty and .tex files it discovers. The .lvt tests
      # end with l3build's \END instead of \end{document}, which it cannot
      # parse, and it does not discover them.
      - name: Check formatting
        run: pipx run badness==0.28.0 format --check .

      - name: Lint
        run: pipx run badness==0.28.0 lint .

  explcheck:
    name: Lint expl3 (explcheck)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install TeX Live
        uses: zauguin/install-texlive@c9f3ea3d51b2e04d092c4f9d208a19542d5dabcf # v4.5.0
        with:
          texlive_version: 2026
          packages: >-
            scheme-basic
            expltools

      # Settings are in .explcheckrc.
      - name: Lint
        run: explcheck --warnings-are-errors cfflatex.sty

  luacheck:
    name: Lint Lua (luacheck)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install luacheck
        run: sudo apt-get update && sudo apt-get install -y lua-check

      # Settings are in .luacheckrc.
      - name: Lint
        run: luacheck .

  # Test stage.

  l3build:
    name: l3build (TeX Live ${{ matrix.texlive }})
    needs: [badness, explcheck, luacheck]
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # Supported TeX Live releases. Both share the same .tlg files; when
        # adding a release, check that they still match.
        texlive: [2025, 2026]
    steps:
      - uses: actions/checkout@v4

      - name: Install TeX Live
        uses: zauguin/install-texlive@c9f3ea3d51b2e04d092c4f9d208a19542d5dabcf # v4.5.0
        with:
          texlive_version: ${{ matrix.texlive }}
          packages: >-
            scheme-basic
            l3build
            lt3luabridge
            lua-tinyyaml
            lm
            cm-super

      # Runs testfiles/ with pdfLaTeX and LuaLaTeX, and testfiles-noshell/
      # with pdfLaTeX without shell escape (see build.lua).
      - name: Run tests
        run: l3build check

      - name: Show differences from the expected logs
        if: failure()
        run: cat build/test*/*.diff

      - name: Upload test logs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: l3build-test-results-texlive-${{ matrix.texlive }}
          path: |
            build/test*/*.diff
            build/test*/*.log

  doc:
    name: Build the manual
    needs: [badness, explcheck, luacheck]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # l3doc needs the packages after lua-tinyyaml.
      - name: Install TeX Live
        uses: zauguin/install-texlive@c9f3ea3d51b2e04d092c4f9d208a19542d5dabcf # v4.5.0
        with:
          texlive_version: 2026
          packages: >-
            scheme-basic
            l3build
            lt3luabridge
            lua-tinyyaml
            alphalph
            booktabs
            csquotes
            enumitem
            fancyvrb
            hologo
            hypdoc
            underscore

      # Typesets cfflatex.tex into cfflatex.pdf with LuaLaTeX (see build.lua).
      - name: Build the manual
        run: l3build doc

      - name: Upload the manual
        uses: actions/upload-artifact@v4
        with:
          name: cfflatex-manual
          path: cfflatex.pdf

      - name: Upload the log
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: cfflatex-manual-log
          path: build/doc/*.log

  # Deploy stage: publish the manual of the head of master to GitHub Pages.
  # Pages must use "GitHub Actions" as its source (Settings > Pages). Every
  # deployment replaces the whole site, so it shows only the latest manual.

  pages:
    name: Deploy the manual to GitHub Pages
    needs: doc
    if: github.event_name == 'push' && github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    # Deployments run one at a time. A queued deployment is replaced by a
    # newer one, and a deployment whose commit is no longer the head of master
    # is skipped below, so an older run never overwrites a newer manual.
    concurrency:
      group: pages
      cancel-in-progress: false
    steps:
      - name: Check that this commit is still the head of master
        id: head
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          head=$(gh api "repos/$GITHUB_REPOSITORY/commits/master" --jq .sha)
          if [ "$head" = "$GITHUB_SHA" ]; then
            echo "current=true" >> "$GITHUB_OUTPUT"
          else
            echo "master is now at $head; skipping $GITHUB_SHA."
            echo "current=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Download the manual
        if: steps.head.outputs.current == 'true'
        uses: actions/download-artifact@v4
        with:
          name: cfflatex-manual
          path: site

      # The site root opens the manual.
      - name: Add an index page
        if: steps.head.outputs.current == 'true'
        run: |
          cat > site/index.html <<'HTML'
          <!DOCTYPE html>
          <html lang="en">
          <head>
            <meta charset="utf-8">
            <title>cffLaTeX manual</title>
            <meta http-equiv="refresh" content="0; url=cfflatex.pdf">
          </head>
          <body>
            <p><a href="cfflatex.pdf">cffLaTeX manual (PDF)</a></p>
          </body>
          </html>
          HTML

      - name: Upload the site
        if: steps.head.outputs.current == 'true'
        uses: actions/upload-pages-artifact@v5
        with:
          path: site

      - name: Deploy
        id: deploy
        if: steps.head.outputs.current == 'true'
        uses: actions/deploy-pages@v5
